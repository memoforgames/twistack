name: Build Android app

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which site the app opens"
        type: choice
        options: [preview, production]
        default: preview
      version_name:
        description: "Version name (e.g. 1.0.1)"
        default: "1.0.1"
      version_code:
        description: "Version code (must be bigger every update)"
        default: "2"
      publish_release:
        description: "Publish as a GitHub release (Twistack.apk)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Prepare the Android project
        run: node scripts/setup-android.js
        env:
          TW_TARGET: ${{ inputs.target }}
          TW_VERSION_NAME: ${{ inputs.version_name }}
          TW_VERSION_CODE: ${{ inputs.version_code }}

      - name: Signing key
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "Missing secret KEYSTORE_BASE64"; exit 1; fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          TW_KEYSTORE: release.keystore
          TW_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          TW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TW_KEY_PASS: ${{ secrets.KEY_PASSWORD }}

      - name: Name the APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk Twistack.apk
          rm -f android/app/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: Twistack-${{ inputs.target }}-${{ inputs.version_name }}
          path: Twistack.apk

      - name: Publish release
        if: ${{ inputs.publish_release && inputs.target == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version_name }}" Twistack.apk --title "Twistack ${{ inputs.version_name }}" --notes "Twistack ${{ inputs.version_name }}"
